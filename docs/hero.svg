<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" role="img"
     aria-label="A page is grabbed from a Mac with a closed hand and lands on an iPad with an open hand">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecf5"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2733"/>
      <stop offset="1" stop-color="#141b24"/>
    </linearGradient>
  </defs>

  <style>
    .label { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #8b97a8; }
    .glyph { font: 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .bar   { fill: #2c3745; }
    .frame { fill: url(#screen); stroke: #3a4756; stroke-width: 2; }
  </style>

  <!-- ── Mac ───────────────────────────────────────────── -->
  <g transform="translate(40,54)">
    <rect class="frame" x="0" y="0" width="250" height="152" rx="10"/>
    <rect class="bar" x="10" y="10" width="230" height="20" rx="5"/>
    <circle cx="22" cy="20" r="3.5" fill="#ff5f57"/>
    <circle cx="34" cy="20" r="3.5" fill="#febc2e"/>
    <circle cx="46" cy="20" r="3.5" fill="#28c840"/>
    <!-- the page, which leaves -->
    <rect x="22" y="44" width="206" height="92" rx="6" fill="url(#card)">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.18;0.26;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="38" y="60" width="120" height="8" rx="4" fill="#9fb0c4">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.18;0.26;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="38" y="78" width="174" height="6" rx="3" fill="#c3cfdd">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.18;0.26;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="38" y="92" width="150" height="6" rx="3" fill="#c3cfdd">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.18;0.26;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="-16" y="152" width="282" height="9" rx="4" fill="#2c3745"/>
  </g>

  <!-- amber rings: something leaving -->
  <g transform="translate(165,130)" fill="none" stroke="#ffb75a">
    <circle r="26" stroke-width="2.5">
      <animate attributeName="r" values="12;66" keyTimes="0;1" dur="1.5s" begin="1.2s;8.2s" repeatCount="1"/>
      <animate attributeName="opacity" values="0;0.95;0" keyTimes="0;0.15;1" dur="1.5s" begin="1.2s;8.2s" repeatCount="1"/>
    </circle>
    <circle r="26" stroke-width="1.6">
      <animate attributeName="r" values="12;66" keyTimes="0;1" dur="1.5s" begin="1.45s;8.45s" repeatCount="1"/>
      <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.15;1" dur="1.5s" begin="1.45s;8.45s" repeatCount="1"/>
    </circle>
  </g>

  <!-- ✊ grab -->
  <text class="glyph" x="150" y="243" text-anchor="middle">✊
    <animate attributeName="opacity" values="0.35;1;1;0.35" keyTimes="0;0.16;0.3;0.45" dur="7s" repeatCount="indefinite"/>
  </text>

  <!-- ── the page in flight ────────────────────────────── -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.28;0.52;0.6;1" dur="7s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="300,104; 300,104; 560,104; 560,104"
                        keyTimes="0;0.2;0.55;1" dur="7s" repeatCount="indefinite"
                        calcMode="spline" keySplines="0 0 1 1; .35 0 .2 1; 0 0 1 1"/>
      <rect x="0" y="0" width="74" height="52" rx="6" fill="url(#card)" stroke="#8fa3ba" stroke-width="1"/>
      <rect x="10" y="12" width="40" height="5" rx="2.5" fill="#9fb0c4"/>
      <rect x="10" y="24" width="54" height="4" rx="2" fill="#c3cfdd"/>
      <rect x="10" y="34" width="46" height="4" rx="2" fill="#c3cfdd"/>
    </g>
  </g>

  <!-- ── iPad ──────────────────────────────────────────── -->
  <g transform="translate(628,34)">
    <rect class="frame" x="0" y="0" width="150" height="196" rx="14"/>
    <!-- the page, arriving -->
    <rect x="14" y="16" width="122" height="164" rx="8" fill="url(#card)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.62;0.92;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="28" y="34" width="64" height="7" rx="3.5" fill="#9fb0c4" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.62;0.92;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="28" y="50" width="94" height="5" rx="2.5" fill="#c3cfdd" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.62;0.92;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="28" y="62" width="80" height="5" rx="2.5" fill="#c3cfdd" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.62;0.92;1" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- cyan rings: something arriving -->
  <g transform="translate(703,132)" fill="none" stroke="#73d9ff">
    <circle r="26" stroke-width="2.5">
      <animate attributeName="r" values="62;14" keyTimes="0;1" dur="1.4s" begin="3.6s;10.6s" repeatCount="1"/>
      <animate attributeName="opacity" values="0;0.95;0" keyTimes="0;0.2;1" dur="1.4s" begin="3.6s;10.6s" repeatCount="1"/>
    </circle>
    <circle r="26" stroke-width="1.6">
      <animate attributeName="r" values="62;14" keyTimes="0;1" dur="1.4s" begin="3.82s;10.82s" repeatCount="1"/>
      <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.2;1" dur="1.4s" begin="3.82s;10.82s" repeatCount="1"/>
    </circle>
  </g>

  <!-- 🖐️ drop -->
  <text class="glyph" x="703" y="252" text-anchor="middle">🖐️
    <animate attributeName="opacity" values="0.35;0.35;1;1;0.35" keyTimes="0;0.48;0.58;0.72;0.85" dur="7s" repeatCount="indefinite"/>
  </text>

  <text class="label" x="150" y="32" text-anchor="middle">grab it here</text>
  <text class="label" x="703" y="22" text-anchor="middle">drop it there</text>
</svg>

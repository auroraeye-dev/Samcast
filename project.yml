# XcodeGen spec — the human-readable source of truth for the Xcode project.
# Regenerate the .xcodeproj any time with:  xcodegen generate
name: QuackCast
options:
  bundleIdPrefix: com.quackcast
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

# The local Swift package (this repo) providing the portable core + adapters.
packages:
  QuackCast:
    path: .

targets:
  QuackCast:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: QuackCast
        product: QuackCastCore
      - package: QuackCast
        product: QuackCastPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quackcast.app
        PRODUCT_NAME: QuackCast
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/QuackCast.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.9"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

# XcodeGen spec — the human-readable source of truth for the Xcode project.
# Regenerate the .xcodeproj any time with:  xcodegen generate
name: Samcast
options:
  # A bundle identifier is a permanent address, not a brand. It still reads
  # quackcast because changing it would reset every macOS privacy permission
  # and make the iPad treat this as a brand-new app, losing its name and
  # everyone it trusts. Renaming it is a deliberate clean break, not tidying.
  bundleIdPrefix: com.quackcast
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
  createIntermediateGroups: true

# The local Swift package (this repo) providing the portable core + adapters.
packages:
  Samcast:
    path: .

targets:
  Samcast:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: Samcast
        product: SamcastCore
      - package: Samcast
        product: SamcastPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quackcast.app
        PRODUCT_NAME: Samcast
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/Samcast.entitlements
        CODE_SIGN_STYLE: Automatic
        # A stable signing identity is what makes macOS remember granted
        # permissions across rebuilds; ad-hoc signing changes every build and
        # makes the system treat each build as a brand-new app.
        DEVELOPMENT_TEAM: Q5LUR3UAL8
        CODE_SIGN_IDENTITY: "Apple Development" 
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.9"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  SamcastiOS:
    type: application
    platform: iOS
    sources:
      - path: App-iOS
      - path: Shared
    dependencies:
      - package: Samcast
        product: SamcastCore
      - package: Samcast
        product: SamcastPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quackcast.ios
        PRODUCT_NAME: Samcast
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App-iOS/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q5LUR3UAL8
        SWIFT_VERSION: "5.9"

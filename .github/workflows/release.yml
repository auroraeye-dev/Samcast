name: Release

# Push a tag like v0.1.0 to build a universal macOS app and publish it as a
# GitHub Release with Samcast.dmg + Samcast-macOS.zip attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build & package
        run: bash scripts/package.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Samcast.dmg
            dist/Samcast-macOS.zip
          generate_release_notes: true
